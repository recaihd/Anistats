<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anistats | Battle Turn</title>
    <meta name="author" content="RecaiHD">
    <link rel="icon" href="img/icon_site.png">
    <meta name="description" content="Batalhe contra outros personagens de anime em tempo real">
    <meta name="theme-color" content="#A020F0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="jogo.css">
</head>
<body>
    <video autoplay muted loop id="bg-video"><source src="videos/body.mp4" type="video/mp4"></video>
    <div class="overlay"></div>

    <div id="result-screen" class="result-screen hidden">
        <div class="result-card">
            <div id="result-title" class="result-title">VITÓRIA</div>
            <div class="result-points">Você <span id="result-change">+50</span> pontos!</div>
            <button class="btn-primary" onclick="location.reload()">VOLTAR AO INÍCIO</button>
        </div>
    </div>

    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Bem-vindo, Combatente</h2>
            <input type="text" id="login-user" class="input-field" placeholder="Username">
            <input type="password" id="login-pass" class="input-field" placeholder="Senha">
            <button class="btn-primary" style="width: 100%;" onclick="fazerLogin()">ENTRAR NO JOGO</button>
        </div>
    </div>

    <div id="ranking-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>TOP 10 RANKING</h2>
            <div id="ranking-list" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn-primary" onclick="toggleRanking()" style="width: 100%; margin-top: 20px;">FECHAR</button>
        </div>
    </div>

    <header>
        <div class="logo">Ani<span>stats</span></div>
        <div id="user-header-info" class="user-info-bar hidden">
            <div style="font-size: 0.8rem; font-weight: 700;">
                <span id="header-username">---</span> | <span id="header-points">0</span> PTS
            </div>
            <img id="header-avatar" src="img/default_avatar.webp" class="user-avatar-mini" onclick="trocarFoto()">
        </div>
    </header>

    <button class="btn-ranking-toggle" onclick="toggleRanking()">
        <img src="icones/ranking.png" alt="Ranking" style="width: 30px; filter: brightness(0) invert(1);">
    </button>

    <main id="home-screen">
        <img src="img/f1.gif" style="width: 150px; margin-bottom: 20px;">
        <span class="subtitle">Arena Online</span>
        <h1>COMBATE EM<br><span>TURNO.</span></h1>
        <div class="btn-wrapper">
            <img src="img/dance-uwu.gif" class="hover-gif">
            <button class="btn-primary" onclick="irParaSelecao()">JOGAR</button>
        </div>

        <div class="social-links">
        <a href="https://github.com/recaihd" target="_blank" class="social-icon" data-tooltip="Github">
            <img src="icones/github.png" alt="Github">
        </a>
        <a onclick="window.location.href='mailto:ricardosousapixtudo@gmail.com?subject=Proposta%20de%20Trabalho' " class="social-icon" data-tooltip="Contato">
            <img src="icones/mail.png" alt="Contato">
        </a>
        <a href="https://livepix.gg/recai" class="social-icon" data-tooltip="Apoie o projeto ❤">
            <img src="icones/pix.png" alt="Apoiar com PIX">
        </a>
    </div>
    </main>

    <main id="select-screen" class="hidden">
        <span class="subtitle">Escolha seu Campeão</span>
        <div class="preview-flex" id="char-list"></div>
    </main>

    <main id="battle-screen" class="hidden">
        <div id="timer-display">20s</div>
        <div class="arena-grid">
            <div id="player-1">
                <div class="player-profile">
                    <div class="p-avatar-frame"><img id="p1-user-avatar" src=""></div>
                    <div class="p-info-text">
                        <div class="role">Você</div>
                        <div class="user-name" id="p1-user-name">---</div>
                    </div>
                </div>
                <div class="char-card" style="width: 100%; cursor: default;">
                    <div class="char-img"><img id="p1-img" src=""></div>
                    <div class="char-info"><p id="p1-name">---</p></div>
                </div>
                <div class="hp-bar"><div id="p1-hp" class="hp-fill"></div></div>
                <div id="actions" style="margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center;"></div>
            </div>

            <div id="player-2">
                <div class="player-profile">
                    <div class="p-avatar-frame"><img id="p2-user-avatar" src=""></div>
                    <div class="p-info-text">
                        <div class="role">Oponente</div>
                        <div class="user-name" id="p2-user-name">---</div>
                    </div>
                </div>
                <div class="char-card" style="width: 100%; cursor: default;">
                    <div class="char-img"><img id="p2-img" src=""></div>
                    <div class="char-info"><p id="p2-name">---</p></div>
                </div>
                <div class="hp-bar"><div id="p2-hp" class="hp-fill"></div></div>
            </div>
        </div>
        <div id="battle-log" style="margin-top: 20px; font-weight: bold;">Iniciando...</div>
    </main>

<script src="jogo.js"></script>
</body>
</html>
