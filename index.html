<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anistats | Battle Turn</title>
        <meta name="author" content="RecaiHD">
    <meta name="keywords" content="battle, batalha de turnos, anime, otaku, game, jogo, online, multiplayer">
    <meta name="description" content="Batalhe contra outros personagens de anime em tempo real">
    <meta name="theme-color" content="#A020F0">
    <link rel="icon" href="img/icon_site.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
       
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --card-bg: rgba(22, 27, 34, 0.7);
            --primary-pink: #db2777;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border-color: rgba(30, 41, 59, 0.5);
        }
        body {
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-color: black;
        }

  
.social-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 25px;
}

.social-icon {
    position: relative; 
    width: 32px;
    height: 32px;
    opacity: 0.6;
    transition: all 0.3s ease;
    cursor: pointer;
}

.social-icon:hover {
    opacity: 1;
    transform: translateY(-3px);
    filter: drop-shadow(0 0 8px var(--primary-pink));
}

.social-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}


.social-icon::after {
    content: attr(data-tooltip); 
    position: absolute;
    bottom: -130%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0, 0, 0, 0.9);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 1px solid var(--border-color);
    z-index: 100;
}

/* A Setinha (Triângulo) */
.social-icon::before {
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    border: 6px solid transparent;
    border-top-color: rgba(0, 0, 0, 0.9);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
}

/* Efeito Hover */
.social-icon:hover::after, 
.social-icon:hover::before {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}
        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }
        header { position: absolute; top: 0; width: 100%; padding: 40px; display: flex; justify-content: space-between; max-width: 1200px; z-index: 10; }
        .logo { font-size: 1.5rem; font-weight: 800; }
        .logo span { color: var(--primary-pink); text-decoration: underline; }
        main { text-align: center; max-width: 800px; z-index: 10; }
        .subtitle { color: var(--primary-pink); font-size: 0.7rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        h1 { font-size: 4rem; line-height: 0.9; font-weight: 900; margin-bottom: 30px; }
        h1 span { color: var(--primary-pink); }

        #timer-display {
    font-size: 2rem;
    font-weight: 900;
    color: var(--primary-pink);
    text-shadow: 0 0 10px rgba(219, 39, 119, 0.5);
    margin: 10px 0;
}

        .preview-flex { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            justify-items: center; 
            margin-bottom: 40px; 
            max-height: 70vh; 
            overflow-y: auto;
            padding: 10px;
        }

        @media (max-width: 600px) { .preview-flex { grid-template-columns: 1fr; } }

        .char-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; width: 240px; text-align: left; cursor: pointer; transition: 0.3s; }
        .char-card:hover { transform: translateY(-5px); border-color: var(--primary-pink); }
        .char-img { width: 48px; height: 48px; background: #334155; border-radius: 8px; overflow: hidden; border: 1px solid rgba(219, 39, 119, 0.4); }
        .char-img img { width: 100%; height: 100%; object-fit: cover; }
        .btn-primary { background: var(--primary-pink); color: white; border: none; padding: 18px 45px; border-radius: 50px; font-weight: 700; cursor: pointer; }
        .hidden { display: none !important; }
        .arena-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 50px; width: 100%; }
        .hp-bar { width: 100%; height: 15px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .hp-fill { height: 100%; background: #10b981; transition: width 0.5s ease; width: 100%; }
        
        /* SKILL BUTTONS & ULT */
        .skill-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--primary-pink); color: white; padding: 10px 20px; cursor: pointer; border-radius: 8px; margin: 5px; transition: 0.2s; font-weight: bold; }
        .skill-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: gray; }
        
        .ult-btn {
            background: linear-gradient(45deg, #7000ff, #db2777) !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.6);
        }
        .ult-ready { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px #db2777; }
            100% { transform: scale(1); }
        }

        /* ANIMAÇÕES DE DANO */
        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-5px, 0); }
            40% { transform: translate(5px, 0); }
            60% { transform: translate(-5px, 0); }
            80% { transform: translate(5px, 0); }
        }
        .shake { animation: shake 0.4s; }

/* CONTAINER DO BOTÃO JOGAR */
.btn-wrapper {
    position: relative;
    display: inline-block;
    margin-top: 20px;
}

/* O GIF DE DANÇA */
.hover-gif {
    position: absolute;
    bottom: 80%; /* Posiciona acima do botão */
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 80px; /* Ajuste o tamanho conforme preferir */
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    pointer-events: none; /* Garante que o mouse clique no botão, não no gif */
    z-index: 15;
}

/* MOSTRAR GIF NO HOVER */
.btn-wrapper:hover .hover-gif {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* AJUSTE NO BOTÃO PARA CABER NO WRAPPER */
.btn-primary {
    position: relative;
    z-index: 10;
}

        .damage-flash { filter: brightness(2) contrast(2); transition: 0.2s; }
        .floating-damage { position: absolute; top: 20%; left: 50%; color: #ff4d4d; font-size: 3rem; font-weight: 900; text-shadow: 2px 2px 0px #000; animation: floatUp 0.8s forwards; z-index: 100; }
        @keyframes floatUp { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-50px); } }
    </style>
</head>
<body>
    <video autoplay muted loop id="bg-video"><source src="videos/body.mp4" type="video/mp4"></video>
    <div class="overlay"></div>

    <header>
        <div class="logo">Ani<span>stats</span></div>
        <div id="status-rede" style="font-size: 0.8rem; color: var(--text-dim);">Conectado</div>
    </header>

<main id="home-screen">
 <img src="img/f1.gif" style="width: 150px; margin-bottom: 20px;">
    <span class="subtitle">Arena Online</span>
    <h1>COMBATE EM<br><span>TURNO.</span></h1>
    
    <div class="btn-wrapper">
        <img src="img/dance-uwu.gif" class="hover-gif" alt="dance">
        <button class="btn-primary" onclick="irParaSelecao()">JOGAR</button>
        </div>

    <div class="social-links">
        <a href="https://github.com/recaihd" target="_blank" class="social-icon" data-tooltip="Github">
            <img src="icones/github.png" alt="Github">
        </a>
        <a onclick="window.location.href='mailto:ricardosousapixtudo@gmail.com?subject=Proposta%20de%20Trabalho' " class="social-icon" data-tooltip="Contato">
            <img src="icones/mail.png" alt="Contato">
        </a>
        <a href="https://livepix.gg/recai" class="social-icon" data-tooltip="Apoie o projeto ❤">
            <img src="icones/pix.png" alt="Apoiar com PIX">
        </a>
    </div>
</main>

    <main id="select-screen" class="hidden" style="max-width: 900px;">
        <span class="subtitle">Escolha seu Campeão</span>
        <div class="preview-flex" id="char-list"></div>
    </main>

    <main id="battle-screen" class="hidden">
        <div id="timer-display" class="hidden">20s</div>
        <div class="arena-grid">
            <div id="player-1">
                <div class="char-card" style="width: 100%; cursor: default;">
                    <div class="char-img"><img id="p1-img" src=""></div>
                    <div class="char-info"><p>VOCÊ</p><p id="p1-name">---</p></div>
                </div>
                <div class="hp-bar"><div id="p1-hp" class="hp-fill"></div></div>
                <div id="actions" style="margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center;"></div>
            </div>
            <div id="player-2">
                <div class="char-card" style="width: 100%; cursor: default;">
                    <div class="char-img"><img id="p2-img" src=""></div>
                    <div class="char-info"><p>OPONENTE</p><p id="p2-name">---</p></div>
                </div>
                <div class="hp-bar"><div id="p2-hp" class="hp-fill"></div></div>
            </div>
        </div>
        <div id="battle-log" style="margin-top: 30px; color: var(--text-dim); font-weight: bold; font-size: 1.2rem;">Aguardando...</div>
    </main>

<script>
    const personagensManuais = [
        { id: 1, nome: "Goku", img: "img/goku.png", hp: 150, ataques: [{n: "Kamehameha", d: 30}, {n: "Soco", d: 15}], ult: "Instinto Superior" },
        { id: 2, nome: "Saitama", img: "img/saitama.png", hp: 150, ataques: [{n: "Soco Sério", d: 38}, {n: "Soco Normal", d: 20}], ult: "Soco de Morte" },
        { id: 3, nome: "Naruto", img: "img/naruto.png", hp: 150, ataques: [{n: "Rasengan", d: 30}, {n: "Clone", d: 20}], ult: "Modo Baryon" },
        { id: 4, nome: "Makima", img: "img/makima.png", hp: 150, ataques: [{n: "Bang!", d: 32}, {n: "Controle", d: 17}], ult: "Sacrifício Ritual" },
        { id: 5, nome: "Frieren", img: "img/frieren.png", hp: 150, ataques: [{n: "Zoltraak", d: 38}, {n: "Mana Blast", d: 17}], ult: "Magia Apocalíptica" },
        { id: 6, nome: "Roxy", img: "img/roxy.png", hp: 150, ataques: [{n: "Water Splash", d: 30}, {n: "Cajado", d: 16}], ult: "Canto do Oceano" },
        { id: 7, nome: "Megumin", img: "img/megumin.png", hp: 150, ataques: [{n: "EXPLOSION!", d: 37}, {n: "Cajadada", d: 16}], ult: "GRANDE EXPLOSÃO" },
        { id: 8, nome: "Zero Two", img: "img/zerotwo.png", hp: 150, ataques: [{n: "Strelizia", d: 32}, {n: "Garra", d: 16}], ult: "Fúria de Klaxossauro" },
        { id: 9, nome: "Miku", img: "img/miku.png", hp: 150, ataques: [{n: "Beijo do Amor", d: 32}, {n: "Soco Fofo", d: 15}], ult: "Sinfonia Digital" }
    ];

    const socket = io(window.location.origin);
    let minhaSala = null, meuPersonagem = null, meuTurno = false;
    let meusStatus = { turnos: 0, cds: {} };
    let tempoRestante = 20;
    let cronometroFront = null;

    function irParaSelecao() {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('select-screen').classList.remove('hidden');
        renderChars();
    }

    function renderChars() {
        const list = document.getElementById('char-list');
        list.innerHTML = personagensManuais.map(c => `
            <div class="char-card" onclick="confirmarEscolha(${c.id})">
                <div class="char-img"><img src="${c.img}"></div>
                <div class="char-info"><p>Level 100</p><p>${c.nome}</p></div>
            </div>
        `).join('');
    }

    function confirmarEscolha(id) {
        meuPersonagem = personagensManuais.find(c => c.id === id);
        document.getElementById('select-screen').innerHTML = "<h2 style='margin-top:50px'>Procurando oponente...</h2>";
        socket.emit('procurarPartida', meuPersonagem);
    }

    function iniciarCronometro() {
        if (cronometroFront) clearInterval(cronometroFront);
        
        tempoRestante = 20;
        const display = document.getElementById('timer-display');
        if (display) {
            display.classList.remove('hidden');
            display.innerText = tempoRestante + "s";
            display.style.color = "var(--primary-pink)";
        }

        cronometroFront = setInterval(() => {
            tempoRestante--;
            if (display) {
                display.innerText = tempoRestante + "s";
                if (tempoRestante <= 5) display.style.color = "#ff4d4d";
            }
            if (tempoRestante <= 0) clearInterval(cronometroFront);
        }, 1000);
    }

socket.on('startBattle', (dados) => {
        minhaSala = dados.salaId;
        meuTurno = (dados.p1Id === socket.id);
        
        document.getElementById('select-screen').classList.add('hidden');
        document.getElementById('battle-screen').classList.remove('hidden');

        // Lógica de Identificação correta:
        const souOPlayer1 = (socket.id === dados.p1Id);
        const eu = souOPlayer1 ? dados.player1 : dados.player2;
        const oponente = souOPlayer1 ? dados.player2 : dados.player1;

        // Atualiza meu personagem (Lado Esquerdo)
        document.getElementById('p1-name').innerText = eu.nome;
        document.getElementById('p1-img').src = eu.img;
        meuPersonagem = eu; // Garante que ataques e ult sejam do char escolhido

        // Atualiza oponente (Lado Direito)
        document.getElementById('p2-name').innerText = oponente.nome;
        document.getElementById('p2-img').src = oponente.img;
        
        renderAcoes();
        iniciarCronometro();
        document.getElementById('battle-log').innerText = meuTurno ? "Seu turno!" : "Aguardando oponente...";
    });

    function renderAcoes() {
        const container = document.getElementById('actions');
        let botoes = meuPersonagem.ataques.map(a => {
            const emCD = meusStatus.cds[a.n] > 0;
            return `
                <button class="skill-btn" onclick="usarAtaque(${a.d}, '${a.n}', false)" 
                    ${(!meuTurno || emCD) ? 'disabled' : ''}>
                    ${a.n} ${emCD ? `(${meusStatus.cds[a.n]}T)` : `(${a.d} DMG)`}
                </button>
            `;
        }).join('');

        const podeUlt = meusStatus.turnos >= 6;
        botoes += `
            <button class="skill-btn ult-btn ${podeUlt ? 'ult-ready' : ''}" 
                onclick="usarAtaque(75, '${meuPersonagem.ult}', true)" 
                ${(!meuTurno || !podeUlt) ? 'disabled' : ''}>
                ULT: ${meuPersonagem.ult} ${!podeUlt ? `(${6 - meusStatus.turnos}T)` : ''}
            </button>
        `;
        container.innerHTML = botoes;
    }

    function usarAtaque(dano, nome, isUlt) {
        if (!meuTurno) return;
        socket.emit('atacar', { salaId: minhaSala, danoBase: dano, nomeAtaque: nome, isUlt });
        meuTurno = false;
        renderAcoes();
    }

    socket.on('atualizarBatalha', (res) => {
        const isEuAtacando = res.atacante === socket.id;
        const alvoIdStr = isEuAtacando ? 'player-2' : 'player-1';
        const hpId = isEuAtacando ? 'p2-hp' : 'p1-hp';
        const alvoElement = document.getElementById(alvoIdStr);
        const alvoImg = alvoElement.querySelector('.char-img img');

        // Feedback visual de dano
        if (res.dano > 0) {
            const danoTexto = document.createElement('div');
            danoTexto.classList.add('floating-damage');
            danoTexto.innerText = `-${res.dano}`;
            alvoElement.appendChild(danoTexto);
            setTimeout(() => danoTexto.remove(), 800);

            alvoElement.classList.add('shake');
            alvoImg.classList.add('damage-flash');
            setTimeout(() => {
                alvoElement.classList.remove('shake');
                alvoImg.classList.remove('damage-flash');
            }, 400);
        }

        // Atualizar HP e Log
        document.getElementById(hpId).style.width = res.novoHpAlvo + "%";
        document.getElementById('battle-log').innerText = res.dano === 0 ? 
            "Tempo esgotado! Turno passado." : 
            `${isEuAtacando ? 'Você' : 'Oponente'} usou ${res.nomeAtaque}!`;
        
        // Sincronizar status e turno
        if (res.statsP1.id === socket.id) meusStatus = res.statsP1;
        else meusStatus = res.statsP2;

        meuTurno = res.proximoTurno === socket.id;
        
        renderAcoes();
        iniciarCronometro();
    });

    socket.on('fimBatalha', (res) => {
        clearInterval(cronometroFront);
        alert(res.vencedor === socket.id ? "VITÓRIA!" : "DERROTA!");
        location.reload();
    });
</script>
</body>
</html>
